
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#090503">

<title>ASHISH~BHAI | Official Telegram</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
}

body {
  background: #090503;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}

.page {
  width: 100%;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px 18px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse at center,
      rgba(255,76,0,.09),
      transparent 65%),
    #090503;
}

/* MAIN CARD */

.card {
  width: 100%;
  max-width: 770px;
  padding: clamp(35px,7vh,65px) 28px;
  border-radius: 48px;
  border: 1.5px solid rgba(255,112,30,.35);

  background:
    radial-gradient(ellipse at 50% 15%,
      rgba(111,38,5,.20),
      transparent 55%),
    linear-gradient(145deg,#190b04,#100602,#160902);

  box-shadow:
    0 0 40px rgba(255,75,0,.09),
    0 0 100px rgba(255,75,0,.06),
    inset 0 0 35px rgba(255,105,20,.025);

  text-align: center;
  position: relative;
  animation: cardAppear 1s ease both;
}

@keyframes cardAppear {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* LOGO */

.logo-box {
  width: clamp(180px,38vw,320px);
  aspect-ratio: 1/1;
  margin: 0 auto 38px;
  border-radius: 43px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;

  background: #2a1107;
  border: 7px solid transparent;

  background-image:
    linear-gradient(#2a1107,#2a1107),
    linear-gradient(135deg,#ff9a26,#ff3b08,#e94a08);

  background-origin: border-box;
  background-clip: padding-box,border-box;

  box-shadow:
    0 0 25px rgba(255,85,0,.38),
    0 0 55px rgba(255,85,0,.16);

  animation: logoGlow 3s ease-in-out infinite;
}

.logo-letter {
  font-family: Arial,sans-serif;
  font-size: clamp(100px,20vw,165px);
  font-weight: 400;
  font-style: italic;
  color: #ff893c;
  line-height: 1;
  text-shadow:
    0 0 12px rgba(255,95,20,.35),
    0 0 30px rgba(255,80,0,.2);
  transform: skew(-8deg);
}

@keyframes logoGlow {
  0%,100% {
    box-shadow:
      0 0 25px rgba(255,85,0,.3),
      0 0 55px rgba(255,85,0,.12);
  }
  50% {
    box-shadow:
      0 0 35px rgba(255,85,0,.55),
      0 0 75px rgba(255,85,0,.25);
  }
}

/* HEADLINE */

h1 {
  font-family: Georgia,serif;
  font-size: clamp(28px,7vw,58px);
  font-weight: 400;
  letter-spacing: 5px;
  white-space: nowrap;

  background: linear-gradient(
    90deg,#ffc49a,#ff9456,#ffd1a7
  );

  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;

  margin-bottom: 13px;
}

/* FIRE */

.fire {
  font-size: 78px;
  display: inline-block;
  margin: 0 auto 18px;
  filter: drop-shadow(0 0 15px #ff5a16);
  animation: fireMove 2s ease-in-out infinite;
}

@keyframes fireMove {
  0%,100% {
    transform: scale(1) translateY(0);
  }
  50% {
    transform: scale(1.12) translateY(-5px);
  }
}

/* ORANGE LINE */

.orange-line {
  width: 105px;
  height: 3px;
  margin: 0 auto 32px;
  background: linear-gradient(
    90deg,transparent,#ff5c16,#ff9a3c,transparent
  );
  box-shadow: 0 0 12px #ff5a16;
}

/* DESCRIPTION */

.description {
  font-size: clamp(17px,3vw,29px);
  line-height: 1.45;
  color: #ffb58c;
  font-weight: 600;
  max-width: 590px;
  margin: 0 auto 43px;
}

/* TELEGRAM BUTTON */

.telegram-btn {
  width: 96%;
  min-height: clamp(82px,12vh,140px);
  margin: 0 auto;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;

  border-radius: 30px;
  border: 2px solid rgba(255,190,120,.35);

  background: linear-gradient(
    110deg,#ff861a 0%,#ff580e 55%,#ed3507 100%
  );

  color: white;
  text-decoration: none;
  font-size: clamp(20px,4vw,38px);
  font-weight: 900;
  letter-spacing: 2px;

  box-shadow:
    0 0 30px rgba(255,75,0,.32),
    0 15px 40px rgba(255,70,0,.16),
    inset 0 2px 8px rgba(255,255,255,.25);

  transition: .3s;
  animation: buttonGlow 2.5s ease-in-out infinite;
}

.telegram-btn:hover {
  transform: translateY(-4px);
  box-shadow: 0 0 45px rgba(255,85,0,.65);
}

.telegram-icon {
  font-size: 30px;
}

@keyframes buttonGlow {
  0%,100% {
    box-shadow: 0 0 25px rgba(255,75,0,.3);
  }
  50% {
    box-shadow: 0 0 40px rgba(255,75,0,.55);
  }
}

/* FOOTER */

.footer {
  color: #b88b72;
  font-size: clamp(15px,2.5vw,22px);
  margin-top: 32px;
  font-weight: 400;
  letter-spacing: .3px;
}

/* MOBILE */

@media(max-width:600px) {

  .page {
    padding: 18px 20px;
  }

  .card {
    padding: clamp(25px,5.5vh,55px) 20px;
    border-radius: 35px;
  }

  .logo-box {
    width: clamp(175px,38vw,240px);
    margin-bottom: 32px;
    border-radius: 38px;
    border-width: 6px;
  }

  .logo-letter {
    font-size: clamp(105px,23vw,145px);
  }

  h1 {
    font-size: clamp(26px,7.2vw,42px);
    letter-spacing: 3px;
    margin-bottom: 8px;
  }

  .fire {
    font-size: 68px;
    margin-bottom: 14px;
  }

  .orange-line {
    margin-bottom: 30px;
  }

  .description {
    font-size: 18px;
    line-height: 1.4;
    margin-bottom: 38px;
  }

  .telegram-btn {
    width: 100%;
    min-height: 88px;
    border-radius: 25px;
    font-size: 21px;
    gap: 13px;
    letter-spacing: 1.5px;
  }

  .telegram-icon {
    font-size: 27px;
  }

  .footer {
    margin-top: 29px;
    font-size: 16px;
  }
}

/* SHORT MOBILE SCREENS */

@media(max-height:750px) and (max-width:600px) {
  .page {
    padding: 12px 17px;
  }

  .card {
    padding: 20px 18px;
    border-radius: 30px;
  }

  .logo-box {
    width: min(35vw,170px);
    margin-bottom: 18px;
    border-radius: 30px;
  }

  .logo-letter {
    font-size: 100px;
  }

  h1 {
    font-size: 29px;
    margin-bottom: 3px;
  }

  .fire {
    font-size: 49px;
    margin-bottom: 8px;
  }

  .orange-line {
    margin-bottom: 20px;
  }

  .description {
    font-size: 15px;
    margin-bottom: 24px;
  }

  .telegram-btn {
    min-height: 68px;
    font-size: 18px;
    border-radius: 20px;
  }

  .footer {
    margin-top: 18px;
    font-size: 14px;
  }
}

/* VERY SMALL WIDTH */

@media(max-width:350px) {
  h1 {
    font-size: 25px;
    letter-spacing: 2px;
  }

  .description {
    font-size: 14px;
  }

  .telegram-btn {
    font-size: 16px;
    gap: 8px;
  }
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<div class="page">

  <main class="card">

    <!-- LOGO -->
    <div class="logo-box">
      <div class="logo-letter">A</div>
    </div>

    <!-- HEADLINE -->
    <h1>ASHISH~BHAI</h1>

    <!-- FIRE -->
    <div class="fire">🔥</div>

    <!-- ORANGE LINE -->
    <div class="orange-line"></div>

    <!-- DESCRIPTION -->
    <p class="description">
      Daily premium updates, straight to your Telegram.
    </p>

    <!-- TELEGRAM BUTTON -->
    <a
      href="https://telegram.me/+sLV-XwcttEY5N2M1"
      class="telegram-btn"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="telegram-icon">✈</span>
      <span>JOIN TELEGRAM</span>
    </a>

    <!-- FOOTER -->
    <div class="footer">
      Free · opens in Telegram
    </div>

  </main>

</div>

</body>
</html>
